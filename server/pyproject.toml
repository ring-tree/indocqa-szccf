[project]
name = "indocqa-server"
version = "0.1.0"
description = "工阅 IndocQA 检索问答服务"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "openai>=1.30",
    "chromadb>=0.5",
    "langgraph>=0.2",
    "langchain-core>=0.2",
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "rank-bm25>=0.2.2",
    "jieba>=0.42",
    "sentence-transformers>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
